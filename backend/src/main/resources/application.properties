# -- Base de donnees --------------------------------
# Les valeurs par defaut ci-dessous restent pour le developpement local ;
# en production, definissez les variables d'environnement DB_URL / DB_USERNAME /
# DB_PASSWORD (ne jamais commiter de vrais identifiants).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/robot_dashboard}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:apppass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA / Hibernate -------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# -- Serveur ----------------------------------------
server.port=8080

# -- Upload -----------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -- Robot / donnees factices -----------------------
app.robot-id=ROBOT-001
app.seed.enabled=true
app.seed.days=14

# --- Simulation robot en direct (RobotSimulationService) ---
# Ecrit reellement en base toutes les secondes : kilometrage, batterie, position,
# rondes, retours base, docking, anomalies occasionnelles. Le robot suit une
# VRAIE boucle de rues (pas des points aleatoires) afin que le collage aux
# rues cote frontend (OSRM) produise un trajet credible plutot qu'une ligne
# qui coupe a travers un parc/des batiments.
#
# Valeurs calibrees a partir des VRAIS fichiers backend/data/info/docking/*.json :
#   - battery-min=21    -> minimum reellement observe au depart de la base (undocking/start)
#   - battery-max=92    -> niveau cible de pleine charge
#   - duree de patrouille reelle mediane ~27 min, duree de charge reelle mediane ~15 min,
#     distance reelle mediane ~9.2 km/jour -> ~0.66 km par cycle patrouille->charge
#   -> battery-drain-per-tick = 71 / (27*60) ≈ 0.0438
#   -> battery-charge-per-tick = 71 / (15*60) ≈ 0.0789
#   -> km-per-tick = 0.66 / (27*60) ≈ 0.000407
app.simulation.enabled=true
app.simulation.km-per-tick=0.000407
app.simulation.battery-drain-per-tick=0.0438
app.simulation.battery-charge-per-tick=0.0789
app.simulation.battery-min=21
app.simulation.battery-max=92
# Probabilite (0-1) qu'une anomalie soit detectee a chaque tick de patrouille
app.simulation.anomaly-chance=0.006

# -- Import des fichiers JSON reels du robot (au demarrage) ----
# Dossier contenant les sous-dossiers info/ et detection/ avec les vrais
# exports du robot. ./data correspond a /app/data dans le conteneur Docker
# (voir backend/Dockerfile, qui copie backend/data a cet emplacement).
app.data-dir=./data
app.real-data-import.enabled=true

# -- JSON parsing ----------------------------------
spring.jackson.parser.allow-non-numeric-numbers=true

# -- JWT (F5 Authentification) ----------------------
# IMPORTANT (securite) : en production, definissez la variable d'environnement
# JWT_SECRET avec une valeur aleatoire d'au moins 32 caracteres
# (ex: openssl rand -base64 48) et NE LA COMMITEZ JAMAIS dans ce fichier.
jwt.secret=${JWT_SECRET:pguard_secret_key_minimum_256_bits_longue_changez_moi_en_prod}
jwt.expiration=86400000

# -- CORS --------------------------------------------
# Domaines autorises a appeler l'API, separes par des virgules.
# En production, remplacez par le(s) vrai(s) domaine(s) du frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:50288,http://127.0.0.1:4200,http://127.0.0.1:50288}

# -- Inscription --------------------------------------
# Role attribue par defaut aux nouveaux comptes (OPERATEUR ou ADMINISTRATEUR).
app.registration.default-role=${DEFAULT_REGISTRATION_ROLE:OPERATEUR}

# -- Code de verification par e-mail (inscription) ----
app.verification.code-ttl-minutes=10
app.verification.resend-cooldown-seconds=60

# -- Envoi d'e-mails (SMTP) ----------------------------
# A configurer avec un vrai compte SMTP (ex: Gmail + mot de passe d'application,
# SendGrid, Mailgun, Amazon SES...). Ne mettez jamais le mot de passe en clair
# ici : utilisez les variables d'environnement SMTP_USERNAME / SMTP_PASSWORD.
# Exemple pour Gmail : creez un "mot de passe d'application" sur
# https://myaccount.google.com/apppasswords (le mot de passe normal du compte
# ne fonctionnera pas si la validation en 2 etapes est activee).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_HOST:smtp.gmail.com}
app.mail.from-name=PGuard Monitor
# En local uniquement (sans SMTP configure), afficher le code dans les logs
# du serveur au lieu d'echouer silencieusement. A NE JAMAIS ACTIVER EN PRODUCTION.
app.mail.log-code-fallback=${MAIL_LOG_CODE_FALLBACK:true}

# -- Connexion Google (Google Identity Services) ------
# Client ID OAuth 2.0 cree sur https://console.cloud.google.com/apis/credentials
# (type "ID client OAuth" > "Application Web"). Le meme Client ID doit etre
# renseigne cote frontend (frontend/src/app/core/config/app-config.ts).
app.google.client-id=${GOOGLE_CLIENT_ID:}
