# -- Base de donnees --------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/robot_dashboard
spring.datasource.username=appuser
spring.datasource.password=apppass123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -- JPA / Hibernate -------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# -- Serveur ----------------------------------------
server.port=8080

# -- Upload -----------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -- Robot / donnees factices -----------------------
app.robot-id=ROBOT-001
app.seed.enabled=true
app.seed.days=14

# --- Simulation robot en direct (RobotSimulationService) ---
# Ecrit reellement en base toutes les secondes : kilometrage, batterie, position,
# rondes, retours base, docking, anomalies occasionnelles. Le robot suit une
# VRAIE boucle de rues (pas des points aleatoires) afin que le collage aux
# rues cote frontend (OSRM) produise un trajet credible plutot qu'une ligne
# qui coupe a travers un parc/des batiments.
#
# Valeurs calibrees a partir des VRAIS fichiers backend/data/info/docking/*.json :
#   - battery-min=21    -> minimum reellement observe au depart de la base (undocking/start)
#   - battery-max=92    -> niveau cible de pleine charge
#   - duree de patrouille reelle mediane ~27 min, duree de charge reelle mediane ~15 min,
#     distance reelle mediane ~9.2 km/jour -> ~0.66 km par cycle patrouille->charge
#   -> battery-drain-per-tick = 71 / (27*60) ≈ 0.0438
#   -> battery-charge-per-tick = 71 / (15*60) ≈ 0.0789
#   -> km-per-tick = 0.66 / (27*60) ≈ 0.000407
app.simulation.enabled=true
app.simulation.km-per-tick=0.000407
app.simulation.battery-drain-per-tick=0.0438
app.simulation.battery-charge-per-tick=0.0789
app.simulation.battery-min=21
app.simulation.battery-max=92
# Probabilite (0-1) qu'une anomalie soit detectee a chaque tick de patrouille
app.simulation.anomaly-chance=0.006

# -- Import des fichiers JSON reels du robot (au demarrage) ----
# Dossier contenant les sous-dossiers info/ et detection/ avec les vrais
# exports du robot. ./data correspond a /app/data dans le conteneur Docker
# (voir backend/Dockerfile, qui copie backend/data a cet emplacement).
app.data-dir=./data
app.real-data-import.enabled=true

# -- JSON parsing ----------------------------------
spring.jackson.parser.allow-non-numeric-numbers=true

# -- JWT (F5 Authentification) ----------------------
jwt.secret=pguard_secret_key_minimum_256_bits_longue_changez_moi_en_prod
jwt.expiration=86400000
