services:
  db:
    image: mysql:8.0
    container_name: stagev2-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: robot_dashboard
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: stagev2-backend
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/robot_dashboard
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      APP_ROBOT_ID: ROBOT-001
      APP_SEED_ENABLED: "true"
      APP_DATA_DIR: ./data
      APP_REAL_DATA_IMPORT_ENABLED: "true"
      # -- Sécurité / authentification (voir SETUP_AUTH.md) --------------
      JWT_SECRET: ${JWT_SECRET:-pguard_secret_key_minimum_256_bits_longue_changez_moi_en_prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # -- Envoi d'e-mails (code de vérification à l'inscription) --------
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_LOG_CODE_FALLBACK: ${MAIL_LOG_CODE_FALLBACK:-true}
      # -- Connexion Google Sign-In ---------------------------------------
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

  frontend:
    build: ./frontend
    container_name: stagev2-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db_data:
